# ============================================================
#  MossBoss  |  Yapımcı: wulnrydev
#  BoxPvP sunucuları için Tılsım tabanlı Boss tetikleme sistemi.
#
#  Renk kullanımı:
#   - Klasik kodlar:  &7, &l, &c ...
#   - Hex kodlar:     &#RRGGBB
# ============================================================

prefix: "&#15FF08&lʙᴏxᴘᴠᴘ &8▸ "

# ── Tılsım Eşyası Tanımı ────────────────────────────────────
tilsim:
  # Bukkit Material adı (BÜYÜK HARF)
  material: NETHER_STAR
  # /mb give ile verildiğinde eşyada görünecek isim (&/&#RRGGBB renk kodları desteklenir)
  display-name: "&#ffd500&lTılsım"
  # Eşya açıklaması — her satır ayrı bir liste elemanı (boş bırakılabilir)
  lore:
    - "&7Bir boss'u uyandırmak için"
    - "&7placeholder'a sağ tıklayın."
  # ResourcePack custom model data değeri (-1 = devre dışı)
  custom-model-data: 1001
  # PDC anahtar değeri — eşyada bu değer olmalıdır
  pdc-value: "mossboss_tilsim"

# ── Global Mesajlar ─────────────────────────────────────────
messages:
  # Boss canlandırıldığında tüm sunucuya atılan duyuru.
  # Kullanılabilir yer tutucular: %prefix%, %player%, %boss_name%
  spawn-broadcast: "%prefix%&#00D420%boss_name% &7ɪsɪᴍʟɪ ʙᴏss, &#ffd500%player% &7ᴛᴀʀᴀꜰɪɴᴅᴀɴ ᴄᴀɴʟᴀɴᴅɪʀɪʟᴅɪ!"

  # Oyuncu Tılsım olmadan tıkladığında gönderilen mesaj.
  no-tilsim: "%prefix%&7ʙᴜ ʙᴏss'ᴜ ᴛᴇᴛɪᴋʟᴇᴍᴇᴋ ɪᴄɪɴ &#ffd500ᴛɪʟsɪᴍ &7ᴛᴜᴛᴍᴀʟɪsɪɴɪᴢ."

  # Boss zaten aktifken tıklandığında gönderilen mesaj.
  already-active: "%prefix%&7ʙᴜ ʙᴏss &#00D420ᴢᴀᴛᴇɴ ᴀᴋᴛɪꜰ&7. ᴅɪɢᴇʀ ᴏʏᴜɴᴄᴜʟᴀʀ ᴢᴀᴛᴇɴ ᴄᴀɴʟᴀɴᴅɪʀᴅɪ."

  # Yapılandırma yeniden yüklendiğinde admin'e gönderilen mesaj.
  reload-success: "%prefix%&#00D420Yᴀᴘɪʟᴀɴᴅɪʀᴍᴀ ʙᴀsᴀʀɪʏʟᴀ ʏᴇɴɪᴅᴇɴ ʏüᴋʟᴇɴᴅɪ."

  # Geçersiz komut kullanımında gönderilen mesaj.
  usage: "%prefix%&7ᴋᴜʟʟᴀɴɪᴍ&8: &#ffd500/mb <reload|status|forcespawn <id>|give [oyuncu]>"

  # Geçersiz boss ID'si girildiğinde.
  unknown-boss: "%prefix%&7&#ffd500%id% &7ɪᴅ'ʟɪ ʙᴏss ʙᴜʟᴜɴᴀᴍᴀᴅɪ."

  # Boss öldürüldüğünde atılan duyuru başlığı.
  # Yer tutucular: %prefix%, %boss_name%
  kill-broadcast-header: "%prefix%&#ff4444%boss_name% &7ᴋᴀᴛʟᴇᴅɪʟᴅɪ! &8ᴇɴ ᴄᴏᴋ ʜᴀsᴀʀ ᴠᴇʀᴇɴʟᴇʀ&8:"

  # Her sıralama için tek satır.
  # Yer tutucular: %prefix%, %boss_name%, %rank%, %player%, %damage%, %reward%
  kill-broadcast-rank: "%prefix%&#ffd500%rank%. &7%player% &8▸ &c%damage% &7ʜᴀsᴀʀ &8| &#00D420%reward%"

# ── Boss Girişleri ──────────────────────────────────────────
# Her giriş benzersiz bir 'id' değerine sahip olmalıdır.
bosses:
  - id: "ancient_golem"
    # Boss'un bulunacağı dünya adı
    world: "world"
    # Koordinatlar
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    # Haritada sabit duran, hareketsiz placeholder MythicMob tipi
    placeholder-mythic-id: "AncientGolemPlaceholder"
    # Tılsım ile tetiklenince spawn olan gerçek boss tipi
    real-boss-mythic-id: "AncientGolem"
    # Boss öldükten sonra placeholder'ın geri gelmesi için bekleme süresi (saniye)
    respawn-delay-seconds: 3600
    # Bu boss için özel duyuru mesajı (boş bırakılırsa global mesaj kullanılır)
    spawn-broadcast: ""
    # ModelEngine model adı (boş = ModelEngine kullanılmaz)
    model-id: ""
    # Bossbar — boss doğduğunda tüm oyunculara gösterilir; boş bırakılırsa gösterilmez
    # Yer tutucular: {health}, {max_health}
    bossbar-title: "&#ffd500Ancient Golem &8| &c{health} &8/ &7{max_health} ❤"
    # Renk: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    bossbar-color: "YELLOW"
    # Stil: PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    bossbar-style: "PROGRESS"
    # Otomatik despawn — boss bu süre (saniye) içinde öldürülmezse yok olur (-1 = sınırsız)
    despawn-after-seconds: 900
    # Ödüller — en çok hasar veren oyunculara sırasıyla verilir
    # {player} yer tutucusu oyuncu adıyla değiştirilir
    # name: kill duyurusunda gösterilecek ödül adı
    rewards:
      - rank: 1
        name: "Kit Kasası Anahtarı"
        commands:
          - "crates key give {player} kit 1"
      - rank: 2
        name: "Coin Kasası Anahtarı"
        commands:
          - "crates key give {player} coin 1"
      - rank: 3
        name: "Event Kasası Anahtarı"
        commands:
          - "crates key give {player} event 1"

  - id: "void_titan"
    world: "world"
    x: 100.5
    y: 64.0
    z: -200.5
    yaw: 90.0
    placeholder-mythic-id: "VoidTitanPlaceholder"
    real-boss-mythic-id: "VoidTitan"
    respawn-delay-seconds: 7200
    spawn-broadcast: "%prefix%&#00D420ᴠᴏɪᴅ ᴛɪᴛᴀɴ &7ᴜʏᴀɴᴅɪ! &#ffd500%player% &7ᴜʏᴀɴᴅɪʀᴅɪ!"
    model-id: ""
    bossbar-title: "&#9b59b6Void Titan &8| &c{health} &8/ &7{max_health} ❤"
    bossbar-color: "PURPLE"
    bossbar-style: "PROGRESS"
    despawn-after-seconds: 900
    rewards:
      - rank: 1
        name: "Kit Kasası Anahtarı"
        commands:
          - "crates key give {player} kit 1"
      - rank: 2
        name: "Coin Kasası Anahtarı"
        commands:
          - "crates key give {player} coin 1"
      - rank: 3
        name: "Event Kasası Anahtarı"
        commands:
          - "crates key give {player} event 1"
